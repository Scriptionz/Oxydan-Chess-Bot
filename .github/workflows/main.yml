name: Oxydan Lichess Bot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  workflow_dispatch: # Manuel başlatma
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik başlar

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Gelişmiş havuz yönetimi ve performans için 3.11'e çekildi

      - name: Cerebellum Kitabini Indir ve Kur
        run: |
          echo "📚 Devasa açılış kitabı indiriliyor..."
          curl -L "https://github.com/Scriptionz/Oxydan-Chess-Bot/releases/download/v1_Book/Cerebellum3Merge.zip" -o book.zip
          
          echo "📂 ZIP'ten çıkarılıyor..."
          unzip book.zip
          
          # Dosya adını kodun tanıması için 'book.bin' yapıyoruz
          mv Cerebellum3Merge.bin book.bin
          echo "✅ Kitap hazır: $(ls -lh book.bin)"

      - name: Kutuphaneleri Kur
        run: |
          pip install -r requirements.txt

      - name: Motoru Derle (Oxydan V11 NNUE Core)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
          cd src
          
          echo "🧹 Temizlik yapılıyor..."
          make clean 2>/dev/null || true
          
          echo "🚀 NNUE ve AVX2 bayrakları zorlanarak derleniyor..."
          
          # 'EVALFILE' değişkenini boş bir değerle tetikliyoruz ki 
          # Makefile içindeki 'ifdef EVALFILE' bloğu tetiklensin ve USE_NNUE=1 olsun.
          # Sonra 'basic' hedefiyle derliyoruz.
          
          make basic EVALFILE=dummy.nnue COMP=clang
          
          if [ -f Ethereal ]; then
            chmod +x Ethereal
            echo "✅ Derleme başarılı: $(ls -lh Ethereal)"
          else
            echo "❌ Derleme başarısız."
            exit 1
          fi
          cd ..

      - name: Oxydan V11 Pre-Flight Diagnostics (Gelişmiş Teşhis)
        run: |
          chmod +x ./src/Ethereal
          # Yeni güncellediğimiz check_bot.py dosyasını çalıştırarak 
          # sınıf uyumluluğunu ve zombi süreç kalıntılarını denetliyoruz.
          python check_bot.py

      - name: Botu Baslat
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          # Config dosyasındaki token yer tutucusunu güncelle
          sed -i "s/\$LICHESS_TOKEN/$LICHESS_TOKEN/g" config.yml || echo "Config hatasi!"
          
          # Botu başlat
          python -u lichess-bot.py
